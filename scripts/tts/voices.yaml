# キャラクターごとの Irodori-TTS VoiceDesign キャプション・プリセット。
# caption はそのまま infer.py --caption に渡される。参照音声はまだ無いので全員 --no-ref 前提。
# 声質を変えたいときはここを編集するだけで、以後の generate.sh 呼び出し全てに反映される。

momoka:
  name_ja: 田邊 桃香
  caption: >-
    20代前半の潔癖で正義感の強い女性教師の声。
    まっすぐでハキハキとした話し方だが、根は生真面目で余裕のなさが声に出る。
    声のトーンはやや高め、近い距離感で自然に話す。

himawari:
  name_ja: 金城 向日葵
  caption: >-
    18歳、明るく快活な学校の人気者の声。
    元気でテンションが高く人懐っこいが、時折自分に向けられる視線を無自覚に意識する軽い浮ついた響きが混じる。
    声のトーンは高めでよく通る、近い距離感で自然に話す。

kaede:
  name_ja: 遠山 楓
  caption: >-
    20代後半の落ち着いた大人の女性の声。
    知的で凛とした話し方だが、言葉の端々にわずかな棘と神経質さがにじむ。
    声のトーンはやや低めで、近い距離感で自然に話す。

hiiragi:
  name_ja: 橘 柊
  caption: >-
    19歳、守ってあげたくなる可憐で内向的な女性の声。
    小さく控えめで自信なさげな話し方。やや低音だが少しハスキー。
    声のトーンは高めで柔らかく、近い距離感で自然に話す。
